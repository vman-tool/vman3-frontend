<div [class]="'relative ' + (widthClass || 'w-40')">
  <!-- Dropdown Select -->
  <select id="malariaStatus" [(ngModel)]="selectedValue" (ngModelChange)="onChange($event)"
    [class]="'block w-full bg-white border border-gray-300 rounded-md shadow-sm appearance-none focus:ring-blue-500 focus:border-blue-500 '
      + (compact ? 'px-2.5 py-1 text-xs' : 'px-4 py-2 sm:text-sm')">
    <option *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>

  <!-- Custom Dropdown Icon -->
  <div [class]="'absolute inset-y-0 right-0 flex items-center pointer-events-none ' + (compact ? 'pr-1.5' : 'pr-2')">
    <svg [class]="(compact ? 'w-3.5 h-3.5' : 'w-5 h-5') + ' text-gray-500'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </div>
</div>
