<div *ngIf="{
  codedVas: codedVas$ | async
} as params">

  <div>
    <div class="m-2" *ngIf="!params?.codedVas && loadingData">
      <mat-progress-bar class=".mat-progress-bar-buffer" color="'blue'" [mode]="'indeterminate'">
      </mat-progress-bar>
    </div>
    <div class="overflow-x-none">
      <div class="w-full overflow-hidden">
        <div class="relative w-full overflow-x-auto shadow-md sm:rounded-lg">
          <table class="w-full text-sm table-fixed">
            <thead class="sticky top-0 z-10 bg-gray-50">
              <tr class="text-xs font-semibold tracking-wider text-gray-500 uppercase">
                <th *ngFor="let column of columns" class="px-4 py-3 text-left border-b border-gray-200">
                  {{ column.label }}
                </th>
                <th class="px-4 py-3 w-24 text-center border-b border-gray-200">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let va of params?.codedVas?.data"
                class="border-b border-gray-100 hover:bg-gray-50">
                <td *ngFor="let column of columns" class="px-4 py-2.5 text-sm text-gray-800">
                  <!-- The coder's own underlying cause carries the weight here,
                       so it is the one column allowed to wrap rather than clip. -->
                  <span *ngIf="column.truncate; else plainCell"
                    class="block truncate" [title]="va[column.key]">{{ va[column.key] ?? '—' }}</span>
                  <ng-template #plainCell>
                    <span [ngClass]="column.emphasise ? 'font-medium text-gray-900' : ''">
                      {{ va[column.key] ?? '—' }}
                    </span>
                  </ng-template>
                </td>
                <td class="px-4 py-2.5 text-center whitespace-nowrap">
                  <a class="text-blue-600 cursor-pointer hover:text-blue-800" title="View VA record"
                    (click)="onOpenVA(va?.vaId)"><i class="ph ph-eye"></i></a>
                  <a class="ml-3 text-blue-600 cursor-pointer hover:text-blue-800" title="Open coding"
                    (click)="onUpdateCodedVA(va?.vaId)"><i class="flaticon-stethoscope"></i></a>
                </td>
              </tr>

              <tr *ngIf="!params?.codedVas?.data?.length && !loadingData">
                <td [attr.colspan]="columns.length + 1" class="px-4 py-12 text-center text-gray-500">
                  You have not coded any VA records yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="px-5 py-2 bg-white border-t flex flex-col xs:flex-row" *ngIf="params?.codedVas?.total > 0">
          <mat-paginator [showFirstLastButtons]="true" [pageSizeOptions]="pageSizeOptions"
            [length]="params?.codedVas?.total" [pageIndex]="pageNumber" [pageSize]="limit"
            (page)="onPageChange($event)"></mat-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
