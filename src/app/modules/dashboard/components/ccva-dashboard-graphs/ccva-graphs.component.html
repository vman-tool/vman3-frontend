<div class="mt-4 mb-8">
  <div *ngIf="isLoading; else chartsContent" class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <!-- Skeleton Loader for Bar Chart -->
    <div *ngFor="let item of [1,2,3,4,5,6]" class="p-4 bg-gray-200 border border-gray-300 rounded-lg shadow-lg animate-pulse">
      <div class="w-full h-60 md:h-72">
      </div>
    </div>
  </div>

  <ng-template #chartsContent>
    <div *ngIf="chartKeys.length > 0; else emptyMessage">
      <!-- Chart Rendering Section: all 6 CSMF charts (by gender, then by age
           group) at once - no toggle between the two groups. -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <div *ngFor="let key of chartKeys; trackBy: trackByKey" class="p-4 bg-white border border-gray-200 rounded-lg shadow-lg">
          <span *ngIf="charts[key]" id="chart-{{key}}" class="chart-{{key}}">
            <!-- Title (shared across all 6 charts) + subtitle (the
                 demographic group) with Download Button. Sized close to the
                 other dashboard card titles (Monthly Submissions, VA by Age
                 Group, ...) - a touch larger since it's carrying less text
                 now that the group name moved to its own subtitle line -
                 inlined rather than referencing .card-title by name, since
                 that class is defined in graphs.component.scss and (being
                 view-encapsulated) doesn't reach into this child
                 component's template. -->
            <div class="flex justify-between items-start mb-4">
              <div class="min-w-0">
                <div class="text-sm font-semibold tracking-tight leading-snug text-gray-700">
                  {{ chartTitle }}
                </div>
                <div class="text-[11px] text-gray-400 mt-0.5">
                  {{ getChartSubtitle(key) }}
                </div>
              </div>
              <img (click)="downloadChart(key)" src="assets/icons/download.svg" class="h-6 cursor-pointer shrink-0 ml-2"
                alt="Download chart" />

            </div>

            <div class="flex justify-center w-full">
              <div class="w-full h-60 md:h-72">
                <canvas baseChart [datasets]="charts[key].datasets" [labels]="charts[key].labels"
                  [options]="chartOptions" [type]="'bar'" [legend]="true"></canvas>
              </div>
            </div>
          </span>
        </div>
      </div>
    </div>

    <!-- Message to Run CCVA -->
    <ng-template #emptyMessage>
      <!-- <div class="text-lg font-semibold text-center text-red-500 mt-60">
        No data available. Please run the CCVA to generate charts.
      </div> -->
    </ng-template>
  </ng-template>
</div>
