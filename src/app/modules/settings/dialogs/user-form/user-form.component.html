<div class="user-form-shell">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <div class="user-form-header">
    <div class="flex items-center gap-3">
      <div class="header-icon-badge">
        <i class="ph ph-user text-blue-600 text-lg"></i>
      </div>
      <div>
        <h2 class="header-title">{{ data?.user ? 'Update User' : 'Add User' }}</h2>
        <p class="header-subtitle">
          {{ data?.user ? 'Edit account details and access permissions' : 'Create a new user account' }}
        </p>
      </div>
    </div>
    <button (click)="onClose()" class="close-btn" title="Close">
      <i class="ph ph-x text-lg"></i>
    </button>
  </div>

  <!-- ── Body ────────────────────────────────────────────────────────────── -->
  <div class="user-form-body">

    <!-- Basic Information -->
    <section>
      <p class="section-label">Basic Information</p>
      <div class="grid grid-cols-12 gap-4 mt-3">
        <div class="col-span-6">
          <label class="field-label">Name</label>
          <input type="text" [(ngModel)]="name" class="form-input">
        </div>
        <div class="col-span-6">
          <label class="field-label">Email</label>
          <input type="email" [(ngModel)]="email" class="form-input">
        </div>
        <div class="col-span-12">
          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="hidden peer" [(ngModel)]="is_active">
            <div class="w-5 h-5 rounded flex border border-gray-400 items-center justify-center flex-shrink-0"
                [ngClass]="{ 'bg-blue-600 border-blue-600 text-white': is_active }">
              <i class="ph-check text-xs" *ngIf="is_active"></i>
            </div>
            <span class="text-sm text-gray-700">Active Account</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Roles & Access -->
    <section>
      <p class="section-label">Roles &amp; Access</p>
      <div class="mt-3">
        <app-assign-roles-form
          [embedded_component]="true"
          (selectRoles)="onSelected($event, 'roles')"
          (selectAccessLimit)="onSelected($event, 'access_limit')">
        </app-assign-roles-form>
      </div>
    </section>

    <!-- Password -->
    <section>
      <p class="section-label">Password</p>
      <p *ngIf="data?.user" class="text-xs text-gray-400 italic mt-1">
        Leave blank to keep the current password.
      </p>
      <div class="grid grid-cols-12 gap-4 mt-3">
        <div class="col-span-6">
          <label class="field-label">Password</label>
          <input type="password" [(ngModel)]="password" class="form-input" placeholder="············">
        </div>
        <div class="col-span-6">
          <label class="field-label">Confirm Password</label>
          <input type="password" [(ngModel)]="confirm_password" class="form-input" placeholder="············">
        </div>
      </div>
    </section>

  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <div class="user-form-footer">
    <button (click)="onClose()" class="btn-cancel">Cancel</button>
    <button (click)="saveUser()" class="btn-save">
      {{ data?.user ? 'Update User' : 'Save User' }}
    </button>
  </div>

</div>
