<div class="p-6 bg-white rounded-lg shadow-md">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <span class="text-2xl font-semibold text-gray-800">{{ data?.user ? 'Update User' : 'Add User' }}</span>
        <mat-icon class="cursor-pointer text-gray-500 hover:text-gray-700" (click)="onClose()">close</mat-icon>
    </div>

    <mat-dialog-content class="center-content">

        <!-- ── Basic Info ─────────────────────────────────────────────────── -->
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" [(ngModel)]="name"
                    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
            </div>
            <div class="col-span-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" [(ngModel)]="email"
                    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
            </div>
            <div class="col-span-12">
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="hidden peer" [(ngModel)]="is_active">
                    <div class="w-5 h-5 rounded flex border border-gray-400 items-center justify-center"
                        [ngClass]="{ 'bg-blue-600 border-blue-600 text-white': is_active }">
                        <i class="ph-check text-xs" *ngIf="is_active"></i>
                    </div>
                    <span class="ml-2 text-sm text-gray-700">Is Active</span>
                </label>
            </div>
        </div>

        <!-- ── Roles & Access ─────────────────────────────────────────────── -->
        <hr class="my-5 border-gray-200">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-4">Roles &amp; Access</p>

        <app-assign-roles-form
            [embedded_component]="true"
            (selectRoles)="onSelected($event, 'roles')"
            (selectAccessLimit)="onSelected($event, 'access_limit')"
        ></app-assign-roles-form>

        <!-- ── Password ───────────────────────────────────────────────────── -->
        <hr class="my-5 border-gray-200">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-4">Password</p>

        <span *ngIf="data?.user" class="block text-xs text-gray-500 italic mb-3">
            Leave blank to keep the current password.
        </span>

        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" [(ngModel)]="password"
                    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                    placeholder="············">
            </div>
            <div class="col-span-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" [(ngModel)]="confirm_password"
                    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                    placeholder="············">
            </div>
        </div>

    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button class="px-6 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            (click)="saveUser()">
            Save User
        </button>
    </mat-dialog-actions>

</div>
