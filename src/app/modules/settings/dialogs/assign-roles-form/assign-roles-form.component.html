<!-- ── Non-embedded: full dialog card layout ─────────────────────────────── -->
<div *ngIf="!embedded_component" class="p-8 bg-white rounded-lg shadow-md">
    <div class="grid grid-cols-12 gap-6">
        <div class="col-span-12">
            <div class="mt-4 ml-4 flex justify-between items-center">
                <div>
                    <span class="text-2xl text-start">ACCESS MANAGEMENT FOR {{data?.user?.name?.toUpperCase()}}</span>
                </div>
                <div class="mr-4">
                    <mat-icon class="cursor-pointer" (click)="onClose()">close</mat-icon>
                </div>
            </div>
        </div>
        <div class="col-span-12">
            <mat-dialog-content class="center-content">
                <ng-container *ngTemplateOutlet="rolesAndAccessContent"></ng-container>
            </mat-dialog-content>
        </div>
    </div>
    <mat-dialog-actions align="end">
        <div class="flex items-center justify-between mt-4">
            <span class="px-2 text-2xl text-start"></span>
            <button class="px-6 py-2 text-white bg-blue-500 rounded hover:bg-blue-700"
                (click)="saveAssignment()">Save Role Assignment</button>
        </div>
    </mat-dialog-actions>
</div>

<!-- ── Embedded: content only, no wrapper ───────────────────────────────── -->
<ng-container *ngIf="embedded_component">
    <ng-container *ngTemplateOutlet="rolesAndAccessContent"></ng-container>
</ng-container>

<!-- ── Shared content ───────────────────────────────────────────────────── -->
<ng-template #rolesAndAccessContent>

    <!-- Roles + Location Access side by side so the dialog doesn't need to
         stack them (and scroll) to show both at once. -->
    <div class="roles-and-access-grid">

        <!-- Roles -->
        <div *ngIf="canAssignRoles">
            <span class="text-[12px] text-gray-600 italic">Click on the role to select or deselect it</span>
            <div class="selection-container">
                <div class="available-items">
                    <label class="block text-gray-700 mb-3 text-sm font-medium">Available Roles ({{ availableRoles.length }})</label>
                    <input type="text"
                        class="mb-3 block w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                        placeholder="Search..." [(ngModel)]="searchTermAvailable">
                    <div class="scrollable-list">
                        <mat-list>
                            <mat-list-item *ngFor="let role of filteredRoles()">
                                <span (click)="moveToSelected(role)">{{ role?.name }}</span>
                            </mat-list-item>
                        </mat-list>
                    </div>
                </div>
                <div class="selected-items">
                    <label class="block text-gray-700 mb-3 text-sm font-medium">Selected Roles ({{ selectedRoles.length }})</label>
                    <input type="text"
                        class="mb-3 block w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                        placeholder="Search..." [(ngModel)]="searchSelectedRolesTerm">
                    <div class="scrollable-list">
                        <mat-list>
                            <mat-list-item *ngFor="let role of filteredSelectedRoles()">
                                <span (click)="moveToAvailable(role)">{{ role?.name }}</span>
                            </mat-list-item>
                        </mat-list>
                    </div>
                </div>
            </div>
        </div>

        <!-- Location Access -->
        <div *ngIf="canLimitDataAccess">
            <span class="text-[12px] text-gray-600 italic">Restrict this user's data to specific administrative level.</span>
            <div class="mt-1">
                <label class="block mb-2 text-sm font-medium text-gray-700">Limit Access By:</label>
                <app-location-tree-select
                    [levels]="locationTypes"
                    [selected]="selectedLocations"
                    [fieldLabels]="field_labels || []"
                    [creatorBoundary]="creatorBoundary"
                    (selectedChange)="onLocationSelectionChange($event)">
                </app-location-tree-select>
            </div>
        </div>

    </div>

</ng-template>
