<div>
  <div class="p-6 bg-white rounded-lg border border-gray-200 shadow-sm">
    <div class="flex justify-between items-center mb-6">
      <div>
        <span class="text-lg font-semibold text-gray-800">
          <i class="mr-2 text-green-600 ph ph-file-arrow-down"></i>
          Export VA records with optional CCVA and PCVA results
        </span>
      </div>
    </div>

    <div class="space-y-6">
      <!-- Filter Configuration -->
      <div class="p-5 bg-gray-50 rounded-lg border border-gray-200">
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">

          <!-- Date Range -->
          <div class="space-y-2 md:col-span-2 xl:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Date Range</label>
            <div class="flex flex-col sm:flex-row items-center sm:space-x-2 space-y-2 sm:space-y-0">
              <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="ph ph-calendar text-gray-400"></i>
                </div>
                <input id="exportStartDate" type="date" [(ngModel)]="filter_startDate"
                  (change)="onDateInputChange($event)"
                  class="pl-10 w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 sm:text-sm transition-colors" />
              </div>
              <span class="hidden sm:inline text-gray-500 font-medium">to</span>
              <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="ph ph-calendar text-gray-400"></i>
                </div>
                <input id="exportEndDate" type="date" [(ngModel)]="filter_endDate"
                  (change)="onDateInputChange($event)"
                  class="pl-10 w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 sm:text-sm transition-colors" />
              </div>
            </div>
            <p class="text-xs text-gray-500">Leave blank to export all records regardless of date</p>
          </div>

          <!-- Date Type -->
          <div class="space-y-2 pt-2">
            <label class="block text-sm font-medium text-gray-700">Filter By Date Type</label>
            <app-custom-dropdown widthClass="w-full" [options]="dateTypeOptions"
              [(selectedValue)]="selectedDateType"></app-custom-dropdown>
            <p class="text-xs text-gray-500">Choose which date field to apply the range to</p>
          </div>

          <!-- Additional Sheets -->
          <div *ngIf="canExportPcvaCcva" class="space-y-2 xl:col-span-3">
            <label class="block text-sm font-medium text-gray-700">Additional Sheets</label>
            <p class="text-xs text-gray-500">Sheet 1 always contains all form submission variables. Check below to add extra sheets.</p>
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-6 p-3 bg-white rounded-lg border border-gray-200">
              <label class="inline-flex items-center space-x-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="includePcva"
                  class="form-checkbox w-5 h-5 text-green-600 rounded focus:ring-green-500 transition duration-150 ease-in-out" />
                <div>
                  <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Include PCVA Results</span>
                  <p class="text-xs text-gray-400">Adds Sheet 2 with PCVA coded causes</p>
                </div>
              </label>
              <label class="inline-flex items-center space-x-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="includeCcva"
                  class="form-checkbox w-5 h-5 text-green-600 rounded focus:ring-green-500 transition duration-150 ease-in-out" />
                <div>
                  <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Include CCVA Results</span>
                  <p class="text-xs text-gray-400">Adds Sheet 3 with CCVA algorithm causes</p>
                </div>
              </label>
            </div>
          </div>

        </div>
      </div>

      <!-- Action -->
      <div class="flex justify-end pt-4 border-t border-gray-200">
        <button (click)="exportData()" [disabled]="isExporting"
          class="inline-flex items-center px-6 py-3 text-sm font-medium text-white bg-green-600 rounded-lg shadow-sm transition-all hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transform hover:-translate-y-0.5 active:translate-y-0">
          <svg *ngIf="isExporting" class="w-5 h-5 mr-2 animate-spin" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <i *ngIf="!isExporting" class="mr-2 ph ph-download-simple"></i>
          <span *ngIf="!isExporting">Export to Excel</span>
          <span *ngIf="isExporting">Generating Export...</span>
        </button>
      </div>
    </div>
  </div>
</div>
