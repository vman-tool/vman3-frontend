<div class="grid grid-cols-3 gap-6 items-start justify-center bg-white">

    <div class="flex flex-col items-center justify-center p-4 rounded-lg">
        <span class="text-xl text-gray-900 mb-5">Favicon</span>
        <div class="mb-4 h-40 w-40 relative flex items-center justify-center">
            <img [src]="previewImages.favicon || systemImages?.favicon" alt="favicon"
                class="max-h-[100%] max-w-[100%] object-contain absolute inset-0 m-auto"
                [class.opacity-50]="uploadingImage === 'favicon'">
            <div *ngIf="uploadingImage === 'favicon'" class="absolute inset-0 flex items-center justify-center">
                <span class="text-2xl animate-spin"><i class="ph-spinner"></i></span>
            </div>
        </div>
        <div class="flex items-center gap-1 mb-2">
            <div class="relative w-11 h-11" title="Upload: upload a new image. Note this will replace the existing image.">
                <input type="file" id="fileInput1" (change)="onFileSelected($event, 'favicon')"
                    [disabled]="uploadingImage === 'favicon'"
                    class="relative w-full h-full opacity-0 cursor-pointer z-10" accept="image/*">
                <label for="fileInput1"
                    class="absolute inset-0 flex items-center justify-center cursor-pointer text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-lg">
                    <span class="text-3xl">
                        <i class="ph-cloud-arrow-up"></i>
                    </span>
                </label>
            </div>
            <button (click)="onDownloadImage('favicon')"
                class="w-11 h-11 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-200 hover:text-gray-900 cursor-pointer"
                title="Download: download the current image.">
                <span class="text-3xl">
                    <i class="ph-download-simple"></i>
                </span>
            </button>
            <button (click)="onResetSingleImage('favicon')" [disabled]="!hasCustomImage('favicon') || resettingImage"
                class="w-11 h-11 flex items-center justify-center rounded-lg transition-colors" [ngClass]="{
                    'text-red-500 hover:bg-red-50 cursor-pointer': hasCustomImage('favicon') && !resettingImage,
                    'text-gray-300 cursor-not-allowed': !hasCustomImage('favicon') || resettingImage
                  }" title="Delete: delete the current image and reset to default.">
                <span class="text-3xl">
                    <i [ngClass]="resettingImage === 'favicon' ? 'ph-spinner animate-spin' : 'ph-trash'"></i>
                </span>
            </button>
        </div>
        <p *ngIf="validationErrors.favicon" class="text-xs text-red-600 text-center max-w-[180px]">{{ validationErrors.favicon }}</p>
    </div>

    <div class="flex flex-col items-center justify-center p-4 rounded-lg">
        <span class="text-xl text-gray-900 mb-5">Logo</span>
        <div class="mb-4 h-40 w-40 relative flex items-center justify-center">
            <img [src]="previewImages.logo || systemImages?.logo" alt="logo"
                class="max-h-[100%] max-w-[100%] object-contain absolute inset-0 m-auto"
                [class.opacity-50]="uploadingImage === 'logo'">
            <div *ngIf="uploadingImage === 'logo'" class="absolute inset-0 flex items-center justify-center">
                <span class="text-2xl animate-spin"><i class="ph-spinner"></i></span>
            </div>
        </div>
        <div class="flex items-center gap-1 mb-2">
            <div class="relative w-11 h-11" title="Upload: upload a new image. Note this will replace the existing image.">
                <input type="file" id="fileInput2" (change)="onFileSelected($event, 'logo')"
                    [disabled]="uploadingImage === 'logo'"
                    class="relative w-full h-full opacity-0 cursor-pointer z-10" accept="image/*">
                <label for="fileInput2"
                    class="absolute inset-0 flex items-center justify-center cursor-pointer text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-lg">
                    <span class="text-3xl">
                        <i class="ph-cloud-arrow-up"></i>
                    </span>
                </label>
            </div>
            <button (click)="onDownloadImage('logo')"
                class="w-11 h-11 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-200 hover:text-gray-900 cursor-pointer"
                title="Download: download the current image.">
                <span class="text-3xl">
                    <i class="ph-download-simple"></i>
                </span>
            </button>
            <button (click)="onResetSingleImage('logo')" [disabled]="!hasCustomImage('logo') || resettingImage"
                class="w-11 h-11 flex items-center justify-center rounded-lg transition-colors" [ngClass]="{
                    'text-red-500 hover:bg-red-50 cursor-pointer': hasCustomImage('logo') && !resettingImage,
                    'text-gray-300 cursor-not-allowed': !hasCustomImage('logo') || resettingImage
                  }" title="Delete: delete the current image and reset to default.">
                <span class="text-3xl">
                    <i [ngClass]="resettingImage === 'logo' ? 'ph-spinner animate-spin' : 'ph-trash'"></i>
                </span>
            </button>
        </div>
        <p *ngIf="validationErrors.logo" class="text-xs text-red-600 text-center max-w-[180px]">{{ validationErrors.logo }}</p>
    </div>

    <div class="flex flex-col items-center justify-center p-4 rounded-lg">
        <span class="text-xl text-gray-900 mb-5">Login Image</span>
        <div class="mb-4 h-40 w-40 relative flex items-center justify-center">
            <img [src]="previewImages.home_image || systemImages?.home_image" alt="login-image"
                class="max-h-[100%] max-w-[100%] object-contain absolute inset-0 m-auto"
                [class.opacity-50]="uploadingImage === 'home_image'">
            <div *ngIf="uploadingImage === 'home_image'" class="absolute inset-0 flex items-center justify-center">
                <span class="text-2xl animate-spin"><i class="ph-spinner"></i></span>
            </div>
        </div>
        <div class="flex items-center gap-1 mb-2">
            <div class="relative w-11 h-11" title="Upload: upload a new image. Note this will replace the existing image.">
                <input type="file" id="fileInput3" (change)="onFileSelected($event, 'home_image')"
                    [disabled]="uploadingImage === 'home_image'"
                    class="relative w-full h-full opacity-0 cursor-pointer z-10" accept="image/*">
                <label for="fileInput3"
                    class="absolute inset-0 flex items-center justify-center cursor-pointer text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-lg">
                    <span class="text-3xl">
                        <i class="ph-cloud-arrow-up"></i>
                    </span>
                </label>
            </div>
            <button (click)="onDownloadImage('home_image')"
                class="w-11 h-11 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-200 hover:text-gray-900 cursor-pointer"
                title="Download: download the current image.">
                <span class="text-3xl">
                    <i class="ph-download-simple"></i>
                </span>
            </button>
            <button (click)="onResetSingleImage('home_image')" [disabled]="!hasCustomImage('home_image') || resettingImage"
                class="w-11 h-11 flex items-center justify-center rounded-lg transition-colors" [ngClass]="{
                    'text-red-500 hover:bg-red-50 cursor-pointer': hasCustomImage('home_image') && !resettingImage,
                    'text-gray-300 cursor-not-allowed': !hasCustomImage('home_image') || resettingImage
                  }" title="Delete: delete the current image and reset to default.">
                <span class="text-3xl">
                    <i [ngClass]="resettingImage === 'home_image' ? 'ph-spinner animate-spin' : 'ph-trash'"></i>
                </span>
            </button>
        </div>
        <p *ngIf="validationErrors.home_image" class="text-xs text-red-600 text-center max-w-[180px]">{{ validationErrors.home_image }}</p>
    </div>
</div>
<div class="button">
    <button
        (click)="onResetImages($event)"
        [disabled]="!canReset"
        class="px-4 py-2 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        [ngClass]="{
            'bg-gray-500 hover:bg-gray-700 hover:cursor-not-allowed': !canReset,
            'bg-yellow-600 hover:bg-yellow-700 hover:cursor-pointer': canReset,
        }"
        title="Reset every image (favicon, logo, and login image) back to default.">
        Reset All
    </button>
</div>
