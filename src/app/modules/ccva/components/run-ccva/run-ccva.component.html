<ng-container *ngIf="(runState$ | async) as runState">
<div>
  <!-- Header Section with Labels for Date Range, Malaria Status, CCVA Algorithm, HIV Status, and Run Button.
       Stays visible while a run is in progress (rather than being hidden) -
       only the Run button itself disables, so the user can still see the
       settings that are about to apply to their next run. -->
  <div class="mx-auto mb-6">
    <span class="mb-6 text-lg font-semibold text-gray-700">CCVA Analysis</span>

    <div class="mt-3 space-y-6">
      <!-- Date Type and Range Section -->
      <div class="flex items-end space-x-4">
        <!-- Date Type Dropdown -->
        <div class="">
          <label for="dateType" class="block mb-1 text-sm font-medium text-gray-700">Date Type</label>
          <app-custom-dropdown id="dateType" [options]="dateTypeOptions"
          [(selectedValue)]="selectedDateType"></app-custom-dropdown>
        </div>

        <!-- Date Range Dropdown -->
        <div class="">
          <label for="dateRangeOption" class="block mb-1 text-sm font-medium text-gray-700">Data Range</label>
          <app-custom-dropdown id="dateRangeOption" [options]="[
             { value: '200', label: 'Top 200' },
          { value: 'all', label: 'All Records' },
          { value: 'custom', label: 'Custom Date' }
        ]" [(selectedValue)]="dateRangeOption" (selectedValueChange)="onDateRangeChange()"></app-custom-dropdown>
        </div>

        <!-- Start Date Input -->
        <div class="" *ngIf="dateRangeOption === 'custom'">
          <label for="startDate" class="block mb-1 text-sm font-medium text-gray-700">Start Date</label>
          <input id="startDate" type="date" [(ngModel)]="filter_startDate"
            (change)="$any($event.target).blur()"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
        </div>

        <!-- End Date Input -->
        <div class="" *ngIf="dateRangeOption === 'custom'">
          <label for="endDate" class="block mb-1 text-sm font-medium text-gray-700">End Date</label>
          <input id="endDate" type="date" [(ngModel)]="filter_endDate"
            (change)="$any($event.target).blur()"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
        </div>
      </div>

      <!-- Status and Algorithm Section -->
      <div class="flex items-end justify-between">
        <div class="flex items-end space-x-4">
          <!-- Malaria Status Dropdown -->
          <div class="">
            <label for="malariaStatus" class="block mb-1 text-sm font-medium text-gray-700">Malaria Status</label>
            <app-custom-dropdown id="malariaStatus" [options]="[
            { value: 'h', label: 'High' },
            { value: 'l', label: 'Low' },
            { value: 'v', label: 'Very Low' }
          ]" [(selectedValue)]="malariaStatus"></app-custom-dropdown>
          </div>

          <!-- HIV Status Dropdown -->
          <div class="">
            <label for="hivStatus" class="block mb-1 text-sm font-medium text-gray-700">HIV Status</label>
            <app-custom-dropdown id="hivStatus" [options]="[
            { value: 'h', label: 'High' },
            { value: 'l', label: 'Low' },
            { value: 'v', label: 'Very Low' }
          ]" [(selectedValue)]="hivStatus"></app-custom-dropdown>
          </div>

          <!-- CCVA Algorithm Dropdown -->
          <div class="">
            <label for="ccvaAlgorithm" class="block mb-1 text-sm font-medium text-gray-700">CCVA Algorithm</label>
            <app-custom-dropdown id="ccvaAlgorithm" [options]="[
            { value: 'InterVA5', label: 'InterVA5' },
            { value: 'VManML10', label: 'VMan ML 1.0' }
          ]" [(selectedValue)]="ccvaAlgorithm"></app-custom-dropdown>
          </div>

          <!-- VMan ML 1.0 threshold parameters (shown only when VManML10 is selected) -->
          <ng-container *ngIf="ccvaAlgorithm === 'VManML10'">
            <div class="">
              <label for="dkThreshold" class="block mb-1 text-sm font-medium text-gray-700">DK Threshold
                <span class="text-xs text-gray-400 font-normal ml-1">(--dk-threshold)</span>
              </label>
              <input id="dkThreshold" type="number" [(ngModel)]="dkThreshold" min="0" max="1" step="0.05"
                class="w-24 px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" />
            </div>
            <div class="">
              <label for="oodThreshold" class="block mb-1 text-sm font-medium text-gray-700">OOD Threshold
                <span class="text-xs text-gray-400 font-normal ml-1">(--ood-threshold)</span>
              </label>
              <input id="oodThreshold" type="number" [(ngModel)]="oodThreshold" min="0" max="1" step="0.01"
                class="w-24 px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" />
            </div>
          </ng-container>
        </div>

        <!-- Run CCVA Button -->
        <div class="flex items-end gap-2">
          <button *ngIf="runState.status === 'running'"
            class="px-4 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-lg border border-red-200 transition-colors hover:bg-red-100"
            (click)="onCancel()">
            Cancel
          </button>
          <button
            class="px-6 py-2 font-bold text-white bg-blue-500 rounded transition duration-300 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-500"
            [disabled]="runState.status === 'starting' || runState.status === 'running'"
            (click)="onRunCCVA()">
            <span *ngIf="runState.status === 'starting'" class="inline-flex gap-2 items-center">
              <span class="inline-block w-4 h-4 rounded-full border-2 animate-spin spinner-border border-white/60 border-t-transparent"></span>
              Starting...
            </span>
            <span *ngIf="runState.status === 'running'">Running...</span>
            <span *ngIf="runState.status !== 'starting' && runState.status !== 'running'">Run CCVA</span>
          </button>
        </div>
      </div>

      <!-- Data Source and Upload Section -->
      <div class="flex items-end justify-between">
        <div class="flex items-end space-x-4">

          <div>
            <label for="dataSource" class="block mb-1 text-sm font-medium text-gray-700">Data Source</label>
            <app-custom-dropdown id="dataSource" [options]="[
            { value: 'available', label: 'Available Data' },
            { value: 'csv', label: 'Upload CSV' }
          ]" [(selectedValue)]="dataSource" (selectedValueChange)="onDataSourceChange()"></app-custom-dropdown>
          </div>


          <div *ngIf="dataSource === 'csv'" class="flex items-center space-x-2">
            <input type="file" id="csvFile" (change)="onFileSelected($event)" accept=".csv" class="hidden" />
            <label for="csvFile"
              class="px-4 py-2 text-sm font-medium text-white bg-green-500 rounded cursor-pointer hover:bg-green-600">
              Select CSV File
            </label>
            <span *ngIf="selectedFile" class="text-sm text-gray-600">
              {{ selectedFile.name }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Run feedback: a single-line status strip plus a collapsible terminal log,
       both embedded directly in the page flow - no card, no popup, no
       enter/leave animation. Stays put once a run has started or finished;
       the next run simply overwrites it. -->
  <div *ngIf="runState.status !== 'idle'" class="mb-6">
    <div class="flex gap-2 items-center px-3 py-2 text-xs rounded-md border"
      [ngClass]="{
        'bg-blue-50 border-blue-200 text-blue-700': runState.status === 'starting' || runState.status === 'running',
        'bg-green-50 border-green-200 text-green-700': runState.status === 'completed',
        'bg-red-50 border-red-200 text-red-700': runState.status === 'error'
      }">
      <ng-container [ngSwitch]="runState.status">
        <i *ngSwitchCase="'completed'" class="ph ph-check-circle shrink-0"></i>
        <i *ngSwitchCase="'error'" class="ph ph-warning shrink-0"></i>
        <svg *ngSwitchDefault class="w-3 h-3 shrink-0 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </ng-container>

      <span class="font-medium truncate">
        {{ runState.message || (runState.status === 'starting' ? 'Starting...' : 'Running...') }}
      </span>

      <span class="ml-auto tabular-nums shrink-0">{{ runState.progress }}%</span>
      <span class="text-[11px] opacity-75 shrink-0" *ngIf="runState.elapsedTime !== '0:00:00'">{{ runState.elapsedTime }}</span>
    </div>

    <!-- Execution Logs -->
    <div class="mt-2" *ngIf="runState.logs.length > 0 || runState.status === 'running' || runState.status === 'starting'">
      <button (click)="isLogsExpanded = !isLogsExpanded"
        class="flex justify-between items-center px-3 py-1.5 w-full text-xs bg-gray-50 rounded-md border border-gray-200 transition-colors hover:bg-gray-100">
        <div class="flex gap-2 items-center">
          <span class="font-medium text-gray-600">Execution Logs</span>
          <span *ngIf="runState.logs.length > 0"
            class="px-1.5 py-0.5 text-[10px] font-medium bg-white rounded-full border border-gray-300 text-gray-500">{{
            runState.logs.length }}</span>
        </div>
        <div class="flex gap-3 items-center">
          <span *ngIf="runState.logs.length > 0" (click)="clearLogs(); $event.stopPropagation()"
            class="text-gray-500 cursor-pointer hover:text-gray-700">Clear</span>
          <svg class="w-3 h-3 text-gray-400 transition-transform duration-200" [class.rotate-180]="isLogsExpanded"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </button>
      <div class="overflow-hidden transition-all duration-300" [style.max-height]="isLogsExpanded ? '176px' : '0px'">
        <div #logsContainer
          class="overflow-auto p-3 max-h-40 font-mono text-xs bg-gray-50 rounded-b-md border border-t-0 border-gray-200"
          style="scroll-behavior: smooth;">
          <div *ngIf="runState.logs.length === 0" class="italic font-medium text-gray-400">
            Waiting for logs...
          </div>
          <div *ngFor="let log of runState.logs" class="mb-0.5 text-gray-700">
            <span class="mr-1 font-bold text-gray-400">&gt;</span>
            <span [class.text-red-600]="log.includes('ERROR')"
              [class.text-yellow-600]="log.includes('WARNING') || log.includes('WARN')"
              [class.font-semibold]="log.includes('ERROR') || log.includes('WARNING') || log.includes('WARN')">{{ log
              }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</ng-container>
