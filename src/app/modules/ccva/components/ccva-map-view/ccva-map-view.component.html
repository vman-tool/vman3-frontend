<div class="relative w-full h-[520px] rounded-lg overflow-hidden border border-gray-200">
  <div id="ccva-map" class="absolute inset-0 z-0"></div>

  <div *ngIf="legendEntries.length > 0"
       class="absolute bottom-3 left-3 z-[1000] bg-white/95 rounded-lg shadow px-3 py-2 text-xs text-gray-700 max-w-[220px]">
    <div *ngFor="let entry of legendEntries" class="flex items-center gap-1.5 py-0.5">
      <span class="inline-block w-2.5 h-2.5 rounded-full shrink-0" [style.background]="entry.color"></span>
      <span class="truncate">{{ entry.label }}</span>
    </div>
    <label class="flex items-center gap-1.5 text-[10px] text-gray-500 mt-1.5 pt-1.5 border-t border-gray-100 cursor-pointer select-none">
      <input type="checkbox" class="h-3 w-3" [(ngModel)]="showBreakdownPopup" (ngModelChange)="onToggleBreakdownPopup()" />
      Show pop-up
    </label>
    <div class="text-[10px] text-gray-400 mt-1">
      Bubble color {{ showBreakdownPopup ? ' · Hover for more details' : '' }}
    </div>
  </div>

  <div *ngIf="isLoading" class="absolute inset-0 z-[1000] flex items-center justify-center bg-white/70">
    <i class="ph-spinner text-2xl text-gray-400 animate-spin"></i>
  </div>

  <div *ngIf="!isLoading && points.length === 0"
       class="absolute inset-0 z-[1000] flex items-center justify-center text-sm text-gray-400 bg-white/70">
    No GPS points match the current search/filter.
  </div>
</div>
