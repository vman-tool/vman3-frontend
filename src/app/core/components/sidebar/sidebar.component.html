<!-- Collapsed: icon-only strip -->
<div *ngIf="collapsed" class="h-full w-16 py-2 bg-white flex flex-col items-center">
  <ng-container *ngIf="menuItems">
    <ng-container *ngFor="let menuItem of menuItems">
      <a *ngIf="menuItem?.hasAccess"
        [routerLink]="getCollapsedRoute(menuItem)"
        [title]="menuItem.displayText"
        class="flex justify-center items-center w-10 h-10 my-1 rounded-md cursor-pointer hover:bg-gray-200 transition-colors">
        <img *ngIf="menuItem?.icon_asset" [src]="menuItem?.icon_asset" [alt]="menuItem?.displayText"
          class="h-5 w-5 object-contain" />
        <i *ngIf="menuItem?.icon && !menuItem?.icon_asset" [class]="menuItem?.icon"></i>
      </a>
    </ng-container>
  </ng-container>
  <div class="mt-auto mb-2">
    <button (click)="onLogout()" title="Logout"
      class="flex justify-center items-center w-10 h-10 rounded-md cursor-pointer hover:bg-gray-400 transition-colors">
      <img src="../../../../assets/icons/logout.svg" alt="logout-icon" class="h-5 w-5 object-contain" />
    </button>
  </div>
</div>

<!-- Expanded: full sidebar -->
<!-- Flex column so Logout can sit at the bottom. The scroll moved from this
     container to the menu region below it, so a long menu scrolls while Logout
     stays in place instead of scrolling away with it. -->
<div *ngIf="!collapsed" class="flex flex-col h-full p-2 w-64 text-center bg-white">
  <div class="text-xl text-black flex-1 min-h-0 overflow-y-auto">
    <div>
      <ng-container *ngIf="menuItems">
        <div *ngFor="let menuItem of menuItems; let i = index">
          <div
            class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-gray-200 {{ i == selectedItem ? 'bg-gray-200' : ''}}"
            *ngIf="menuItem?.hasAccess">
            <img *ngIf="menuItem?.icon_asset" src="{{ menuItem?.icon_asset }}" alt="{{menuItem?.displayText}}-icon"
              class="h-5" />
            <i *ngIf="menuItem?.icon" class="{{ menuItem?.icon }}"></i>
            <div [routerLink]="menuItem?.route" class="flex justify-between items-center w-full"
              (click)="onSelectMenu(i)">
              <span class="text-[15px] ml-4 text-back">{{ menuItem?.displayText }}</span>
              <span class="text-md" id="arrow" *ngIf="menuItem?.subMenuItems?.length">
                <i class="ph-caret-down {{ i == selectedItem ? 'rotate-180' : ''}}"></i>
              </span>
            </div>
          </div>

          <ng-container *ngIf="menuItem?.subMenuItems?.length">
            <div
              class="leading-7 text-left text-sm font-thin mt-2 w-4/5 mx-auto {{ i == selectedItem ? '' : 'hidden'}}">
              <ng-container *ngFor="let subMenu of menuItem?.subMenuItems; let subIndex = index;">
                <p routerLink="{{menuItem?.route + subMenu?.route}}"
                  class="cursor-pointer py-1 px-2 hover:text-blue-600 rounded-md {{ selectedSubMenu === i+(subIndex+1) ? 'text-blue-600' : '' }}"
                  (click)="onSelectMenu(i, subIndex+1)" *ngIf="subMenu?.hasAccess">
                  <i class="{{subMenu?.icon }}"></i>
                  {{ subMenu?.displayText }}
                </p>
              </ng-container>
            </div>
          </ng-container>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Outside the scrolling menu region, so it is pinned to the bottom of the
       sidebar however long the menu is. It used to sit inside that region with
       a fixed `mt-[100px]`, which pushed it below the sidebar and under the
       footer once the menu grew - Settings being the case that showed it. -->
  <div
    class="flex flex-shrink-0 items-center px-4 mt-2 border-t border-gray-100 pt-3 duration-300 cursor-pointer p-2.5 rounded-md hover:bg-gray-200"
    (click)="onLogout()">
    <img src="../../../../assets/icons/logout.svg" alt="logout-icon" class="h-5" />
    <span class="ml-4 text-[15px] text-black">Logout</span>
  </div>
</div>
